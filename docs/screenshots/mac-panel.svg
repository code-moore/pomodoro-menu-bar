<svg xmlns="http://www.w3.org/2000/svg" width="1118" height="1420" viewBox="0 0 1118 1420" role="img" aria-labelledby="title desc">
<title id="title">Pomodoro full panel</title><desc id="desc">Editable illustration based on the actual Mac interface. Six sample tasks and two meetings. Meeting markers match the task markers: 28 pixels square with an 8 pixel outer corner radius and 3 pixel stroke.</desc>
<rect width="1118" height="1420" fill="#0b0d14"/>
<defs>
 <linearGradient id="glass" x2=".85" y2="1"><stop stop-color="#0b0d14" stop-opacity=".65"/><stop offset=".55" stop-color="#0b0d14" stop-opacity=".55"/><stop offset="1" stop-color="#0b0d14" stop-opacity=".75"/></linearGradient>
 <linearGradient id="card" x2=".8" y2="1"><stop stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#ffffff" stop-opacity=".012"/></linearGradient>
 <linearGradient id="rim" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".43"/><stop offset=".5" stop-color="#cccccc" stop-opacity=".1"/><stop offset="1" stop-color="#ffffff" stop-opacity=".29"/></linearGradient>
 <linearGradient id="inset" x2="0" y2="1"><stop stop-color="#0b0d14" stop-opacity=".80"/><stop offset=".15" stop-color="#0b0d14" stop-opacity=".65"/><stop offset="1" stop-color="#0b0d14" stop-opacity=".50"/></linearGradient>
 <linearGradient id="button" x2="0" y2="1"><stop stop-color="#cccccc" stop-opacity=".23"/><stop offset="1" stop-color="#bbbbbb" stop-opacity=".16"/></linearGradient>
 <symbol id="calendar" viewBox="0 0 28 28"><g fill="none" stroke="#aec7e9" stroke-width="3"><rect x="1.5" y="1.5" width="25" height="25" rx="6.5"/><path d="M3 9h22"/></g><g fill="#aec7e9"><circle cx="9" cy="15" r="1.4"/><circle cx="18" cy="15" r="1.4"/><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/></g></symbol>
 <g id="chevron" stroke="#aec7e9" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m-6 -3 6 6 6-6"/></g>
 <g id="gear" stroke="#aec7e9" fill="none" stroke-width="2.2" stroke-linejoin="round"><path d="M-4-12h8l1 5 4-3 5 6-4 4 4 3-4 7-5-2-1 5h-8l-1-5-4 2-4-7 4-3-4-4 5-6 4 3Z"/><circle r="4.5"/></g>
