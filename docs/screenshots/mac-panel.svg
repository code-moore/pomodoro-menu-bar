</defs><g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" letter-spacing="-.35">
<rect x="777" y="4" width="337" height="50" rx="25" fill="#0b0d14" stroke="#ffffff33" stroke-width="1"/><text x="800" y="37" font-size="25" fill="#cbd5de" font-weight="500" text-anchor="start">Write project…</text><text x="1093" y="38" font-size="27" fill="#f0f3ff" font-weight="500" text-anchor="end">25:00</text><rect x="32" y="68" width="1078" height="1318" rx="32" fill="url(#glass)" stroke="url(#rim)" stroke-width="2"/><rect x="72" y="106" width="998" height="278" rx="44" fill="url(#card)" stroke="#ffffff16" stroke-width="2"/><text x="108" y="228" font-size="92" fill="#f5f5f7" font-weight="650" text-anchor="start">25:00</text><text x="1036" y="166" font-size="25" fill="#aec7e9" font-weight="600" text-anchor="end">0/6 done · 1h 55m of work left</text><use href="#calendar" x="810" y="192" width="28" height="28"/><text x="1036" y="214" font-size="26" fill="#aec7e9" font-weight="500" text-anchor="end">2 meetings today</text><rect x="108" y="282" width="184" height="62" rx="31" fill="none" stroke="#aec7e9" stroke-width="2"/><path d="m190 304 18 10-18 10Z" fill="#aec7e9" stroke="#aec7e9" stroke-width="3" stroke-linejoin="round"/><rect x="313" y="283" width="62" height="62" rx="31" fill="none" stroke="#aeb5c32b" stroke-width="2"/><g stroke="#939aaa" opacity=".57" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M343 306a10 10 0 1 1-9 8m9-14-6 6 6 6"/></g><text x="1036" y="306" font-size="29" fill="#a2a3ad" font-weight="600" text-anchor="end">Write project proposal</text><text x="1036" y="340" font-size="26" fill="#aec7e9" font-weight="500" text-anchor="end">22:13–22:38</text><rect x="72" y="420" width="998" height="924" rx="44" fill="url(#card)" stroke="#ffffff16" stroke-width="2"/><rect x="108" y="458" width="928" height="72" rx="25" fill="url(#inset)" stroke="none" stroke-width="1"/><text x="132" y="506" font-size="28" fill="#93959f" font-weight="500" text-anchor="start">New task</text><rect x="108" y="552" width="166" height="58" rx