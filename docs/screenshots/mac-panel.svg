" stroke="#f5a04a" stroke-width="3"/><text x="176" y="1168" font-size="25" fill="#a9aab3" font-weight="400" text-anchor="start">01:10–01:25</text><text x="380" y="1168" font-size="26" fill="#a9aab3" font-weight="400" text-anchor="start">Review tomorrow’s priorities</text><text x="1010" y="1168" font-size="25" fill="#a9aab3" font-weight="400" text-anchor="end">15m</text><use href="#chevron" transform="translate(1028 1160) scale(0.85)"/><path d="M98 1234h948" stroke="#e0e4ff" stroke-opacity=".13" stroke-width="2"/><rect x="108" y="1261" width="50" height="50" rx="25" fill="url(#button)" stroke="#b9c8e42b" stroke-width="2"/><use href="#gear" transform="translate(133 1286) scale(0.82)"/><rect x="184" y="1261" width="96" height="50" rx="25" fill="url(#button)" stroke="#b9c8e42b" stroke-width="2"/><text x="232" y="1295" font-size="25" fill="#aec7e9" font-weight="600" text-anchor="middle">Quit</text><rect x="306" y="1261" width="50" height="50" rx="25" fill="url(#button)" stroke="#b9c8e42b" stroke-width="2"/><use href="#chevron" transform="translate(331 1286) scale(-1.4)"/><rect x="382" y="1261" width="50" height="50" rx="25" fill="url(#button)" stroke="#b9c8e42b" stroke-width="2"/><use href="#phone" transform="translate(407 1286) scale(0.92)"/><text x="902" y="1295" font-size="25" fill="#858892" font-weight="500" text-anchor="end">Clear done</text><text x="1036" y="1295" font-size="25" fill="#aec7e9" font-weight="600" text-anchor="end">Clear all</text></g></svg>